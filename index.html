<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asteroid Rush — Neon Space Arcade</title>
<meta name="theme-color" content="#05091a">
<style>
:root{color-scheme:dark;--cyan:#63e5ff;--muted:#98adcb;--line:#274668;--blue:#122a51}
*{box-sizing:border-box}html{min-height:100%;background:#030714}body{margin:0;min-height:100vh;color:#e9f7ff;font:15px system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% -18%,#17336b 0%,#070e27 35%,#030713 80%);overflow-x:hidden}
h1,h2,h3,p{margin-top:0}button,input{font:inherit}button{cursor:pointer;touch-action:none}
.site{max-width:1570px;margin:auto;padding:19px 14px 28px}.masthead{text-align:center;margin-bottom:13px}.masthead h1{font-size:clamp(29px,3.4vw,46px);margin:0;line-height:1.1;letter-spacing:.16em;color:#b8f6ff;text-shadow:0 0 11px #00b3ff,0 0 36px #1868dd}
.masthead .credit{margin:7px 0 0;font-size:13px;letter-spacing:.11em;color:#9ac6df;text-shadow:0 0 12px #20a7e744}
.layout{display:grid;grid-template-columns:minmax(260px,290px) minmax(0,960px) minmax(175px,210px);align-items:start;justify-content:center;gap:15px}
.panel{border:1px solid #2e517c;border-radius:16px;padding:18px;background:linear-gradient(155deg,#10254adf,#071229ef);box-shadow:0 0 32px #167ab71f,inset 0 1px #a3e6ff19;min-width:0}.panel h2{font-size:17px;text-align:center;letter-spacing:.115em;color:#95edff;margin:0 0 21px;text-shadow:0 0 14px #00bbff44}
.stat{padding:16px 0;border-bottom:1px solid #ffffff19}.stat:first-of-type{padding-top:0}.stat label{display:block;color:#8fa6c5;letter-spacing:.14em;font-size:11px;font-weight:750;margin-bottom:6px}.stat strong{font-size:29px;letter-spacing:.07em;font-variant-numeric:tabular-nums;text-shadow:0 0 18px #3dccff53}.stat strong.coral{color:#ff8ca9}
.arena{min-width:0}.screen{position:relative;border:1px solid #396a93;border-radius:15px;overflow:hidden;background:#030b1a;box-shadow:0 0 42px #128ad533,0 0 0 4px #4dcfff0a}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none}
.screen:after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 45px #0208179c;border-radius:15px}
.actions{display:grid;gap:10px}.actions button{min-height:43px;padding:11px;border:1px solid #3586b9;border-radius:9px;color:#ecfaff;font-weight:800;font-size:13px;letter-spacing:.08em;background:linear-gradient(110deg,#16457c,#0d274a);box-shadow:inset 0 1px #ffffff1b}
.actions button.primary{border-color:#4de2ff;background:linear-gradient(110deg,#006fa8,#1150a5);box-shadow:0 0 23px #0076ff32}
.actions button:hover{filter:brightness(1.19)}.control-box{border-top:1px solid #ffffff25;margin-top:21px;padding-top:18px}.control-box h3{font-size:19px;letter-spacing:.12em;text-align:center;color:#8adfff;margin-bottom:14px}
.guide{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff1a;font-size:15px;font-weight:800;line-height:1.35}.guide span{color:#d2e7fa}.guide b{color:#80e1ff;text-align:right}
.volume{display:flex;justify-content:space-between;gap:6px;color:#a7c1de;font-size:13px;font-weight:750;margin-top:20px}input[type=range]{width:100%;accent-color:#5fe4ff;cursor:pointer;margin:11px 0 0}
.track-label{display:block;color:#a7c1de;font-size:13px;font-weight:750;letter-spacing:.06em;margin:20px 0 9px}#soundtrack{display:block;width:100%;padding:12px 9px;background:#0b2040;color:#e3faff;border:1px solid #418bb8;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}#soundtrack:focus-visible{outline:2px solid #81eaff;outline-offset:2px}
.mobile-pad{display:none}
@media(max-width:980px){.layout{grid-template-columns:minmax(235px,285px) minmax(0,960px)}.stats{grid-column:1/-1;grid-row:2;display:flex;gap:20px;align-items:center;justify-content:space-around}.stats h2{margin:0}.stats .stat{border:0;padding:0}.settings{grid-column:1;grid-row:1}.arena{grid-column:2;grid-row:1}.site{max-width:1200px}}
@media(max-width:760px){.site{padding:10px 8px 20px}.masthead{margin-bottom:9px}.layout{display:flex;flex-direction:column;gap:12px}.arena,.settings,.stats{width:100%}.settings{order:2}.stats{order:3;display:flex;flex-wrap:wrap}.stats h2{display:none}.stats .stat strong{font-size:21px}.screen{border-radius:10px}.mobile-pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:11px}.mobile-pad button{min-height:68px;border-radius:12px;border:1px solid #387eac;color:#cbf7ff;background:linear-gradient(165deg,#183b71,#091935);font-size:25px;font-weight:900;box-shadow:inset 0 1px #b6f5ff29;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.mobile-pad button:active,.mobile-pad button.held{background:linear-gradient(160deg,#127bb2,#164c98);box-shadow:0 0 18px #25bbff55}.mobile-pad .fire{color:#fff1cd;border-color:#d18a5e;background:linear-gradient(160deg,#8b4639,#442741);font-size:14px;letter-spacing:.04em}.panel{padding:13px}.panel h2{margin-bottom:12px}.actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.actions button{font-size:11px;padding:8px 3px}.guide{font-size:15px}}
@media(max-width:390px){.mobile-pad{gap:5px}.mobile-pad button{min-height:57px}.masthead h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="site">
<header class="masthead"><h1>ASTEROID RUSH</h1><p class="credit">Created by MrJim</p></header>
<div class="layout">
<aside class="panel settings">
<h2>⚙ SETTINGS</h2>
<div class="actions"><button class="primary" id="start">START / RESTART</button><button id="pause">PAUSE</button><button id="mute" aria-pressed="false" aria-label="Mute all music and sound effects">MUTE ALL</button></div>
<div class="volume"><label for="volume">✦ SFX VOLUME</label><span id="volLabel">45%</span></div><input id="volume" type="range" min="0" max="100" value="45">
<div class="volume"><label for="musicVolume">♫ MUSIC VOLUME</label><span id="musicVolLabel">7%</span></div><input id="musicVolume" type="range" min="0" max="100" value="7">
<label class="track-label" for="soundtrack">♫ SOUNDTRACK</label><select id="soundtrack"><option value="ambient">01 · NEBULA DRIFT — CHILL</option><option value="file">02 · AI FIGHT — 120 BPM</option></select>
<div class="control-box"><h3>🎮 CONTROLS</h3>
<div class="guide"><span>← / → or A / D</span><b>ROTATE</b></div>
<div class="guide"><span>↑ or W</span><b>THRUST</b></div>
<div class="guide"><span>SPACE</span><b>FIRE</b></div>
<div class="guide"><span>P</span><b>PAUSE</b></div>
<div class="guide"><span>ENTER</span><b>START / RESTART</b></div>
</div>
</aside>
<main class="arena">
<div class="screen"><canvas id="game" width="960" height="640" aria-label="Asteroid Rush arcade game"></canvas></div>
<div class="mobile-pad" aria-label="Touch controls"><button type="button" data-control="left" aria-label="Rotate left">↶</button><button type="button" data-control="thrust" aria-label="Thrust">▲</button><button type="button" data-control="right" aria-label="Rotate right">↷</button><button class="fire" type="button" data-control="fire" aria-label="Shoot">FIRE</button></div>
</main>
<aside class="panel stats">
<h2>✦ FLIGHT DATA</h2>
<div class="stat"><label>SCORE</label><strong id="score">000000</strong></div>
<div class="stat"><label>HIGH SCORE</label><strong id="best">000000</strong></div>
<div class="stat"><label>WAVE</label><strong id="wave">01</strong></div>
<div class="stat"><label>SHIELDS / LIVES</label><strong class="coral" id="lives">♥ ♥ ♥</strong></div>
</aside>
</div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=640,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const keys=new Set(),touch=new Set();
const scoreEl=$('score'),bestEl=$('best'),waveEl=$('wave'),livesEl=$('lives');
let audio=null,muted=false,state='menu',score=0,best=0,wave=1,lives=3,frame=0,spawnWait=-1;
let ship=null,rocks=[],bullets=[],particles=[],rings=[],stars=[],trails=[];
try{best=Number(localStorage.getItem('asteroidRush.best')||0)||0}catch(e){}
bestEl.textContent=String(best).padStart(6,'0');
for(let i=0;i<160;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.35,1.8),v:rand(.12,.9),a:rand(.2,1)});
function updateHud(){scoreEl.textContent=String(score).padStart(6,'0');bestEl.textContent=String(best).padStart(6,'0');waveEl.textContent=String(wave).padStart(2,'0');livesEl.textContent='♥ '.repeat(lives).trim()||'—'}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('asteroidRush.best',String(best))}catch(e){}}}
// Track 1 is procedural; track 2 uses the user-supplied OGG audio file.
let sfxBus=null,musicBus=null,noiseBuffer=null,musicTimer=null,stepTime=0,stepIndex=0;
// New installations start with AI Fight at 7% music and 45% SFX.
// One-time migration applies the revised defaults for returning visitors, too;
// after that, player changes are preserved across reloads.
let selectedTrack='file';
try{
 const defaultsKey='asteroidRush.audioDefaultsV2';
 if(localStorage.getItem(defaultsKey)==='1'){
  const saved=localStorage.getItem('asteroidRush.track');
  if(saved==='ambient'||saved==='file')selectedTrack=saved;
  for(const [slider,key,label] of [
   ['musicVolume','asteroidRush.musicVolume','musicVolLabel'],
   ['volume','asteroidRush.sfxVolume','volLabel']
  ]){
   const value=localStorage.getItem(key);
   if(value!==null&&/^\d{1,3}$/.test(value)&&Number(value)<=100){
    $(slider).value=value;
    $(label).textContent=value+'%';
   }
  }
 }else{
  localStorage.setItem('asteroidRush.track','file');
  localStorage.setItem('asteroidRush.musicVolume','7');
  localStorage.setItem('asteroidRush.sfxVolume','45');
  localStorage.setItem(defaultsKey,'1');
 }
}catch(e){}
$('soundtrack').value=selectedTrack;
// Browser-native OGG playback keeps the 4:28 recording intact.
const musicFile=new Audio('ai_fight_120bpm.ogg');
musicFile.loop=true;
musicFile.preload='none';
musicFile.addEventListener('error',()=>{if(selectedTrack==='file')console.warn('Music file missing: ai_fight_120bpm.ogg')});
function syncMusicFile(){
 musicFile.volume=Math.max(0,Math.min(1,Number($('musicVolume').value)/100));
 musicFile.muted=muted;
 const shouldPlay=state==='playing'&&selectedTrack==='file'&&!document.hidden;
 if(shouldPlay){
  if(musicFile.paused)musicFile.play().catch(e=>console.warn('Audio playback was blocked or file is unavailable:',e));
 }else if(!musicFile.paused)musicFile.pause();
}
function applyAudioLevels(){
 if(audio&&sfxBus&&musicBus){
  const now=audio.currentTime;
  sfxBus.gain.setTargetAtTime(muted?0:Number($('volume').value)/100*.42,now,.02);
  musicBus.gain.setTargetAtTime(muted||state!=='playing'||document.hidden||selectedTrack!=='ambient'?0:Number($('musicVolume').value)/100*.38,now,.03);
 }
 syncMusicFile();
}
function initAudio(){try{
if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();
sfxBus=audio.createGain();musicBus=audio.createGain();sfxBus.connect(audio.destination);musicBus.connect(audio.destination);
noiseBuffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*.3),audio.sampleRate);
const channel=noiseBuffer.getChannelData(0);for(let i=0;i<channel.length;i++)channel[i]=Math.random()*2-1;
applyAudioLevels();
stepTime=audio.currentTime+.06;musicTimer=setInterval(scheduleMusic,30);
}
if(audio.state==='suspended')audio.resume();
}catch(e){console.warn('Audio unavailable:',e);audio=null}}
function beep(freq,duration=.12,type='sine',gain=.2,endFreq=null){if(muted||!audio||!sfxBus)return;try{
const t=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();
o.type=type;o.frequency.setValueAtTime(freq,t);
if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(25,endFreq),t+duration);
v.gain.setValueAtTime(Math.max(.0001,gain),t);
v.gain.exponentialRampToValueAtTime(.0001,t+duration);
o.connect(v);v.connect(sfxBus);o.start(t);o.stop(t+duration+.02)
}catch(e){}}
function noteHz(midi){return 440*Math.pow(2,(midi-69)/12)}
function synth(note,t,dur,level,type='triangle',cutoff=0,attack=.025){
if(!audio||!musicBus)return;
const osc=audio.createOscillator(),env=audio.createGain();
osc.type=type;osc.frequency.setValueAtTime(noteHz(note),t);
const start=Math.max(.004,Math.min(attack,dur*.35));
env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(Math.max(.0002,level),t+start);
env.gain.exponentialRampToValueAtTime(.0001,t+dur);
if(cutoff){const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=cutoff;osc.connect(filter);filter.connect(env)}else osc.connect(env);
env.connect(musicBus);osc.start(t);osc.stop(t+dur+.02);
}
function noiseHit(t,dur,volume,highpass){
const src=audio.createBufferSource(),hp=audio.createBiquadFilter(),gain=audio.createGain();
src.buffer=noiseBuffer;hp.type='highpass';hp.frequency.value=highpass;
gain.gain.setValueAtTime(Math.max(.0001,volume),t);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);
src.connect(hp);hp.connect(gain);gain.connect(musicBus);src.start(t);src.stop(t+dur+.005);
}
function kick(t,heavy=false){
const osc=audio.createOscillator(),env=audio.createGain();osc.type='sine';
osc.frequency.setValueAtTime(heavy?164:114,t);
osc.frequency.exponentialRampToValueAtTime(heavy?42:53,t+(heavy?.17:.12));
env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(heavy?.48:.16,t+.005);
env.gain.exponentialRampToValueAtTime(.0001,t+(heavy?.29:.18));
osc.connect(env);env.connect(musicBus);osc.start(t);osc.stop(t+.31);
}
const chillRoots=[45,41,38,43];
function musicStep(t,n){
 const step=n%16,bar=Math.floor(n/16);
 const root=chillRoots[bar%chillRoots.length],beat=60/90,stepSec=beat/4;
 if(step===0){for(const semitone of [0,3,7])synth(root+12+semitone,t,stepSec*15,.038,'sine',0,.7);kick(t)}
 if(step===8)kick(t);
 if(step%4===2){const degrees=[0,7,10,7,3,7,12,10];const idx=(bar*4+Math.floor(step/2))%degrees.length;
 synth(root+24+degrees[idx],t,stepSec*3.4,.055,'triangle',0,.02)}
 if(step===6||step===14)noiseHit(t,.09,.02,6500);
}
function scheduleMusic(){
if(!audio||audio.state!=='running')return;
if(state!=='playing'||document.hidden||selectedTrack!=='ambient'){stepTime=audio.currentTime+.06;return}
if(stepTime<audio.currentTime-.2)stepTime=audio.currentTime+.04;
const step=60/90/4;
let iterations=0;
while(stepTime<audio.currentTime+.13&&iterations++<4){musicStep(stepTime,stepIndex++);stepTime+=step}
}
function resetMusicSequence(){
stepIndex=0;musicFile.pause();
if(selectedTrack==='file'){try{musicFile.currentTime=0}catch(e){}}
if(!audio){applyAudioLevels();return}stepTime=audio.currentTime+.06;
if(musicBus){const oldBus=musicBus;
oldBus.gain.setTargetAtTime(0,audio.currentTime,.025);
musicBus=audio.createGain();musicBus.gain.setValueAtTime(0,audio.currentTime);musicBus.connect(audio.destination);
applyAudioLevels();setTimeout(()=>{try{oldBus.disconnect()}catch(e){}},800)}
}
$('soundtrack').addEventListener('change',()=>{selectedTrack=$('soundtrack').value;resetMusicSequence();try{localStorage.setItem('asteroidRush.track',selectedTrack)}catch(e){};initAudio();applyAudioLevels()});
$('musicVolume').addEventListener('input',e=>{$('musicVolLabel').textContent=e.target.value+'%';try{localStorage.setItem('asteroidRush.musicVolume',e.target.value)}catch(e){};applyAudioLevels()});
function held(control){const map={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],thrust:['ArrowUp','KeyW'],fire:['Space']};return touch.has(control)||map[control].some(k=>keys.has(k))}
function wrap(p,pad=0){if(p.x<-pad)p.x=W+pad;else if(p.x>W+pad)p.x=-pad;if(p.y<-pad)p.y=H+pad;else if(p.y>H+pad)p.y=-pad}
function burst(x,y,color,count=18,force=1){for(let i=0;i<count;i++){const a=rand(0,TAU),s=rand(.7,5.2)*force,life=rand(17,43);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:rand(1,3.7),color})}}
function shock(x,y,color){rings.push({x,y,r:4,life:21,color})}
function makeRock(x,y,size=3,vx,vy){const r=({3:54,2:31,1:17})[size],ang=rand(0,TAU),speed=rand(.6,1.3)+wave*.11;
const rock={x,y,size,r,vx:vx??Math.cos(ang)*speed,vy:vy??Math.sin(ang)*speed,angle:rand(0,TAU),spin:rand(-.014,.014),seed:rand(0,TAU),points:[],craters:[],hue:[180,195,278,319,37][Math.floor(rand(0,5))]};
for(let i=0;i<12;i++)rock.points.push(rand(.72,1.08));
for(let i=0;i<4;i++)rock.craters.push({a:rand(0,TAU),d:rand(.12,.54),r:rand(.07,.17)});
rocks.push(rock);return rock}
function startWave(){rocks=[];spawnWait=-1;const count=Math.min(4+wave,11);
for(let i=0;i<count;i++){let x=0,y=0;for(let n=0;n<80;n++){x=rand(65,W-65);y=rand(80,H-60);if(Math.hypot(x-ship.x,y-ship.y)>220)break}
const toward=Math.atan2(ship.y-y,ship.x-x)+rand(-1.8,1.8),spd=rand(.7,1.4)+wave*.11;
makeRock(x,y,3,Math.cos(toward)*spd,Math.sin(toward)*spd)}
ship.inv=150;shock(ship.x,ship.y,'#60e8ff');beep(300,.23,'triangle',.15,560);updateHud()}
function reset(){initAudio();resetMusicSequence();state='playing';applyAudioLevels();score=0;wave=1;lives=3;frame=0;bullets=[];particles=[];rings=[];trails=[];ship={x:W/2,y:H/2,vx:0,vy:0,angle:-Math.PI/2,cool:0,inv:170,thrusting:false};startWave();$('pause').textContent='PAUSE';updateHud()}
function fire(){if(!ship||ship.cool>0)return;ship.cool=10;
const c=Math.cos(ship.angle),s=Math.sin(ship.angle);
bullets.push({x:ship.x+c*28,y:ship.y+s*28,vx:ship.vx*.25+c*10.5,vy:ship.vy*.25+s*10.5,life:76});
burst(ship.x+c*26,ship.y+s*26,'#afffff',5,.65);beep(740,.09,'square',.09,320)}
function destroyRock(i){const rock=rocks[i];if(!rock)return;
rocks.splice(i,1);const points=({3:20,2:50,1:100})[rock.size];
score+=points;saveBest();updateHud();
burst(rock.x,rock.y,rock.size===3?'#62f3ff':'#ff74cd',rock.size===3?36:22,rock.size===3?1.55:1.2);
shock(rock.x,rock.y,rock.size===3?'#4de6ff':'#ffba80');
beep(rock.size===3?125:rock.size===2?190:280,.2,'sawtooth',.21,55);
if(rock.size>1){for(let j=0;j<2;j++){const a=Math.atan2(rock.vy,rock.vx)+(j?1:-1)*rand(.65,1.3),s=Math.hypot(rock.vx,rock.vy)*1.4+rand(.4,1);makeRock(rock.x+Math.cos(a)*12,rock.y+Math.sin(a)*12,rock.size-1,Math.cos(a)*s,Math.sin(a)*s)}}}
function damage(){if(ship.inv>0||state!=='playing')return;lives--;burst(ship.x,ship.y,'#7aecff',65,1.75);shock(ship.x,ship.y,'#ff638b');beep(160,.4,'sawtooth',.38,38);
ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.angle=-Math.PI/2;ship.inv=140;
if(lives<=0){state='gameover';saveBest();applyAudioLevels();beep(95,.5,'triangle',.3,37)}updateHud()}
function togglePause(){if(state==='playing'){state='paused';$('pause').textContent='RESUME'}else if(state==='paused'){state='playing';$('pause').textContent='PAUSE'}applyAudioLevels()}
$('start').addEventListener('click',reset);$('pause').addEventListener('click',()=>{initAudio();togglePause()});
$('mute').addEventListener('click',()=>{muted=!muted;const button=$('mute');button.textContent=muted?'UNMUTE ALL':'MUTE ALL';button.setAttribute('aria-pressed',String(muted));button.setAttribute('aria-label',muted?'Unmute all music and sound effects':'Mute all music and sound effects');if(!muted)initAudio();applyAudioLevels()});
$('volume').addEventListener('input',e=>{$('volLabel').textContent=e.target.value+'%';try{localStorage.setItem('asteroidRush.sfxVolume',e.target.value)}catch(e){};applyAudioLevels()});
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLElement&&e.target.closest('input,select,textarea,[contenteditable="true"]'))return;
if(['ArrowUp','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault();
if(e.repeat&&(e.code==='Enter'||e.code==='KeyP'))return;
keys.add(e.code);if(e.code==='Enter')reset();if(e.code==='KeyP')togglePause();if(e.code==='Space'&&state==='menu')reset();initAudio()});
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();touch.clear()});document.addEventListener('visibilitychange',applyAudioLevels);
document.querySelectorAll('[data-control]').forEach(button=>{
const control=button.dataset.control;
function off(e){if(e) e.preventDefault();touch.delete(control);button.classList.remove('held')}
button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);touch.add(control);button.classList.add('held');initAudio();if(state==='menu'||state==='gameover')reset()});
button.addEventListener('pointerup',off);button.addEventListener('pointercancel',off);button.addEventListener('lostpointercapture',off)});
function tick(dt){frame+=dt;
for(const star of stars){star.x-=star.v*.14*dt;if(star.x<0)star.x=W}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.975,dt);p.vy*=Math.pow(.975,dt);p.life-=dt}
particles=particles.filter(p=>p.life>0);
for(const ring of rings){ring.r+=5.2*dt;ring.life-=dt}
rings=rings.filter(r=>r.life>0);
if(state!=='playing'){if(state==='menu'){for(const r of rocks){r.x+=r.vx*dt*.25;r.y+=r.vy*dt*.25;wrap(r,r.r)}}return}
if(held('left'))ship.angle-=.066*dt;if(held('right'))ship.angle+=.066*dt;
ship.thrusting=held('thrust');
if(ship.thrusting){ship.vx+=Math.cos(ship.angle)*.18*dt;ship.vy+=Math.sin(ship.angle)*.18*dt;
if(Math.random()<.9){const a=ship.angle+Math.PI+rand(-.35,.35);const s=rand(1.2,3.7);particles.push({x:ship.x-Math.cos(ship.angle)*22,y:ship.y-Math.sin(ship.angle)*22,vx:ship.vx*.35+Math.cos(a)*s,vy:ship.vy*.35+Math.sin(a)*s,life:rand(9,21),max:21,size:rand(1.4,4.5),color:Math.random()<.5?'#4ceaff':'#ffb55c'})}}
const drag=Math.pow(.994,dt);ship.vx*=drag;ship.vy*=drag;
const speed=Math.hypot(ship.vx,ship.vy),limit=6.4;if(speed>limit){ship.vx*=limit/speed;ship.vy*=limit/speed}
ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship,20);
if(Math.hypot(ship.vx,ship.vy)>.6||ship.thrusting){trails.push({x:ship.x,y:ship.y,angle:ship.angle,life:21,max:21});if(trails.length>33)trails.shift()}
for(const tr of trails)tr.life-=dt;trails=trails.filter(tr=>tr.life>0);
ship.inv=Math.max(0,ship.inv-dt);ship.cool=Math.max(0,ship.cool-dt);if(held('fire'))fire();
for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.angle+=r.spin*dt;wrap(r,r.r)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;wrap(b)}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(b.life<=0){bullets.splice(i,1);continue}
const hit=rocks.findIndex(r=>Math.hypot(b.x-r.x,b.y-r.y)<r.r*.84+3);
if(hit!==-1){bullets.splice(i,1);destroyRock(hit)}}
if(ship.inv<=0){for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r*.78+16){damage();break}}}
if(!rocks.length){if(spawnWait<0)spawnWait=95;else {spawnWait-=dt;if(spawnWait<=0){wave++;startWave()}}}}
function drawBackdrop(){
const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#030d20');bg.addColorStop(.48,'#070b1e');bg.addColorStop(1,'#140727');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
function nebula(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'#00000000');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
nebula(130,130,400,'#007fba19');nebula(835,560,440,'#c72aff1f');nebula(560,100,280,'#11ffbb12');
ctx.lineWidth=1;
// A reactive vector grid bends subtly near the player, in the spirit of neon twin-stick arcades.
const anchor=ship||{x:W/2,y:H/2};
function warp(x,y){const dx=x-anchor.x,dy=y-anchor.y;
const pull=0.075*Math.exp(-(dx*dx+dy*dy)/(165*165));
return {x:x+dx*pull+Math.sin(y*.021+frame*.012)*1.4,y:y+dy*pull+Math.sin(x*.018+frame*.011)*1.4}}
for(let x=0;x<=W;x+=48){ctx.beginPath();for(let y=0;y<=H;y+=24){const p=warp(x,y);if(y===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='#3579ca22';ctx.stroke()}
for(let y=0;y<=H;y+=48){ctx.beginPath();for(let x=0;x<=W;x+=24){const p=warp(x,y);if(x===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='#3579ca22';ctx.stroke()}
for(const star of stars){const shimmer=.72+.28*Math.sin(frame*.028+star.y);
ctx.globalAlpha=star.a*shimmer;ctx.fillStyle=star.r>1.25?'#b7eaff':'#8198eb';ctx.shadowBlur=star.r>1.25?8:0;ctx.shadowColor='#39dfff';
ctx.fillRect(star.x,star.y,star.r,star.r)}
ctx.globalAlpha=1;ctx.shadowBlur=0;
// Energy nodes and frame accents help the battlefield feel like a holographic arena.
ctx.strokeStyle='#16bced21';ctx.lineWidth=1;
for(let x=48;x<W;x+=192)for(let y=48;y<H;y+=192){
ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke()}
ctx.strokeStyle='#3fe5ff38';ctx.strokeRect(12,12,W-24,H-24);
for(const x of [23,W-23])for(const y of [23,H-23]){
ctx.strokeStyle='#6ce7ff9b';ctx.shadowColor='#53dfff';ctx.shadowBlur=10;ctx.lineWidth=2.4;ctx.beginPath();
ctx.moveTo(x+(x<W/2?0:-20),y);ctx.lineTo(x,y);ctx.lineTo(x,y+(y<H/2?20:-20));ctx.stroke()}
ctx.shadowBlur=0;
}
function drawRock(r){
ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);
const hue=r.hue,color='hsl('+hue+',100%,73%)',n=r.points.length;
function outline(scale){ctx.beginPath();for(let i=0;i<n;i++){
const a=TAU*i/n,dist=r.r*r.points[i]*scale;
if(i===0)ctx.moveTo(Math.cos(a)*dist,Math.sin(a)*dist);
else ctx.lineTo(Math.cos(a)*dist,Math.sin(a)*dist)}
ctx.closePath()}
ctx.fillStyle='hsla('+hue+',70%,13%,.7)';ctx.shadowColor=color;ctx.shadowBlur=29;
outline(1);ctx.fill();ctx.strokeStyle='hsla('+hue+',100%,60%,.23)';ctx.lineWidth=9;ctx.stroke();
ctx.shadowBlur=15;ctx.strokeStyle=color;ctx.lineWidth=2.35;ctx.stroke();
// Inner vector geometry gives each asteroid a luminous, faceted silhouette.
ctx.shadowBlur=0;ctx.strokeStyle='hsla('+hue+',100%,78%,.47)';ctx.lineWidth=1.2;
outline(.67);ctx.stroke();
ctx.beginPath();
for(let i=0;i<n;i+=2){const a=TAU*i/n,dist=r.r*r.points[i];
ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*dist,Math.sin(a)*dist)}
ctx.stroke();
ctx.fillStyle='hsla('+hue+',100%,80%,.78)';ctx.beginPath();ctx.arc(0,0,Math.max(2.5,r.r*.1),0,TAU);ctx.fill();
ctx.restore();
}
function drawShip(){if(!ship)return;
if(ship.inv>0&&Math.floor(frame/6)%2===0)return;
for(const tr of trails){const fade=clamp(tr.life/tr.max,0,1);ctx.save();ctx.translate(tr.x,tr.y);ctx.rotate(tr.angle+Math.PI/2);
ctx.strokeStyle='rgba(56,223,255,'+(fade*.3)+')';ctx.lineWidth=1.7;ctx.beginPath();
ctx.moveTo(0,-29);ctx.lineTo(-18,17);ctx.lineTo(0,12);ctx.lineTo(18,17);ctx.closePath();ctx.stroke();ctx.restore()}
ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle+Math.PI/2);
const grad=ctx.createLinearGradient(-21,0,21,0);
grad.addColorStop(0,'#095098');grad.addColorStop(.5,'#2cc9e9');grad.addColorStop(1,'#062970');
ctx.shadowColor='#31d7ff';ctx.shadowBlur=28;ctx.fillStyle=grad;ctx.strokeStyle='#bbfaff';ctx.lineWidth=2.2;
ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(9,-8);ctx.lineTo(24,15);ctx.lineTo(19,23);
ctx.lineTo(4,14);ctx.lineTo(0,21);ctx.lineTo(-4,14);ctx.lineTo(-19,23);ctx.lineTo(-24,15);ctx.lineTo(-9,-8);ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowBlur=9;ctx.strokeStyle='#d7fbff';ctx.lineWidth=1.4;
ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(0,19);ctx.moveTo(-22,17);ctx.lineTo(-7,6);ctx.moveTo(22,17);ctx.lineTo(7,6);ctx.stroke();
ctx.fillStyle='#07345c';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(7,-1);ctx.lineTo(0,11);ctx.lineTo(-7,-1);ctx.closePath();ctx.fill();
ctx.fillStyle='#a3f7ff';ctx.shadowBlur=13;ctx.fillRect(-19,12,6,4);ctx.fillRect(13,12,6,4);
ctx.shadowBlur=0;if(ship.thrusting){ctx.fillStyle='#ffb86b';ctx.shadowColor='#ffa341';ctx.shadowBlur=27;
for(const x of [-11,11]){ctx.beginPath();ctx.moveTo(x-3,17);ctx.lineTo(x,rand(29,51));ctx.lineTo(x+3,17);ctx.fill()}}
ctx.restore();
if(ship.inv>0){ctx.strokeStyle='#75eaff73';ctx.lineWidth=1.6;ctx.shadowColor='#2bbfff';ctx.shadowBlur=9;ctx.beginPath();
ctx.arc(ship.x,ship.y,31+2*Math.sin(frame*.2),0,TAU);ctx.stroke();ctx.shadowBlur=0}
}
function drawEffects(){
for(const b of bullets){ctx.save();ctx.strokeStyle='#a7faff';ctx.lineWidth=3.6;ctx.shadowBlur=20;ctx.shadowColor='#51e8ff';
ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*1.55,b.y-b.vy*1.55);ctx.stroke();
ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(b.x,b.y,2.9,0,TAU);ctx.fill();ctx.restore()}
for(const ring of rings){const fade=clamp(ring.life/21,0,1);ctx.globalAlpha=fade;ctx.strokeStyle=ring.color;ctx.shadowColor=ring.color;ctx.shadowBlur=22;
ctx.lineWidth=2.7*fade;ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r,0,TAU);ctx.stroke()}ctx.globalAlpha=1;ctx.shadowBlur=0;
for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillRect(-p.size,-p.size*.55,p.size*2.2,p.size*.9);ctx.restore()}
ctx.globalAlpha=1;ctx.shadowBlur=0}
function centerText(txt,y,size,color){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+size+'px system-ui,Arial';ctx.fillStyle=color;ctx.shadowBlur=19;ctx.shadowColor=color;ctx.fillText(txt,W/2,y);ctx.shadowBlur=0}
function overlay(){if(state==='playing'&&spawnWait<0)return;
if(state==='playing'){centerText('SECTOR CLEAR',H*.45,41,'#95f3ff');centerText('NEXT WAVE INCOMING',H*.52,18,'#e9f5ff');return}
ctx.fillStyle='#020916b4';ctx.fillRect(0,0,W,H);
if(state==='menu'){centerText('ASTEROID RUSH',H*.38,54,'#9ceeff');centerText('SURVIVE THE SWARM',H*.49,22,'#e6f5ff');centerText('PRESS ENTER OR START TO PLAY',H*.60,19,'#74d6f7')}
if(state==='paused'){centerText('PAUSED',H*.43,52,'#9ceeff');centerText('PRESS P OR RESUME',H*.54,20,'#e9f5ff')}
if(state==='gameover'){centerText('GAME OVER',H*.39,54,'#ff9db4');centerText('FINAL SCORE  '+score.toLocaleString('en-GB'),H*.49,24,'#f4f6ff');centerText('PRESS ENTER OR RESTART',H*.59,19,'#91e5ff')}}
function render(){drawBackdrop();for(const r of rocks)drawRock(r);drawEffects();drawShip();overlay()}
for(let i=0;i<7;i++)makeRock(rand(50,W-50),rand(50,H-50),i%3+1,rand(-.65,.65),rand(-.65,.65));
let last=0;function loop(now){const dt=Math.min(2.3,(now-last)/16.6667||1);last=now;tick(dt);render();requestAnimationFrame(loop)}
updateHud();requestAnimationFrame(loop);
})();
</script>
